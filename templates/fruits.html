<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>we are using jinja template by for loop to display the elements</h1>
    <ul>
        {% for fruit in fruits %}
            <li><h2>{{ fruit }}</h2></li>
        {% endfor %}
    </ul>
</body>
</html>
